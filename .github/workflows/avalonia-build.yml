name: Avalonia Build and Package
on:
  push:
    branches: [ master, main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.0.6). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  AVALONIA_PROJECT: WareHound.Avalonia/WareHound.Avalonia.csproj
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '8.0.x'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
    - name: Determine version
      id: ver
      shell: bash
      env:
        INPUT_TAG: ${{ github.event.inputs.tag }}
      run: |
        # Tag push -> use the pushed tag; manual run -> use the 'tag' input (if any)
        ref="${{ github.ref }}"
        if [[ "$ref" == refs/tags/v* ]]; then tag="${ref#refs/tags/}"; else tag="$INPUT_TAG"; fi
        v="${tag#v}"
        if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then v="0.0.0"; tag=""; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Version: $v  Release tag: ${tag:-<none>}"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      RID: win-x64
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build C++ Sniffer DLL
      run: |
        msbuild WareHound.Sniffer\WareHound.Sniffer.vcxproj `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=x64 `
          /p:SolutionDir="$env:GITHUB_WORKSPACE\" `
          /m

    - name: Publish Avalonia app
      run: |
        dotnet publish ${{ env.AVALONIA_PROJECT }} `
          -c ${{ env.BUILD_CONFIGURATION }} `
          -r ${{ env.RID }} `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:SkipNativeSnifferBuild=true `
          -p:Version=${{ env.VERSION }} `
          -o publish\${{ env.RID }}

    - name: Copy Sniffer DLL next to the app
      shell: powershell
      run: |
        $dll = "bin\${{ env.BUILD_CONFIGURATION }}\WareHound.Sniffer.dll"
        if (-not (Test-Path $dll)) { Write-Host "[ERROR] $dll not found"; exit 1 }
        Copy-Item $dll -Destination "publish\${{ env.RID }}" -Force
        Write-Host "[OK] Sniffer DLL copied"

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Build Windows installer (Inno Setup)
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path installer-output | Out-Null
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
          "/DAppVersion=${{ env.VERSION }}" `
          "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ env.RID }}" `
          "/DOutputDir=$env:GITHUB_WORKSPACE\installer-output" `
          installer\avalonia\WareHound.Avalonia.iss
        if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] Inno Setup build failed"; exit 1 }
        Get-ChildItem installer-output

    - name: Zip portable build
      shell: powershell
      run: |
        Compress-Archive -Path "publish\${{ env.RID }}\*" `
          -DestinationPath "installer-output\WareHound-Avalonia-${{ env.VERSION }}-${{ env.RID }}.zip" -Force

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WareHound-Avalonia-Windows
        path: installer-output/*
        retention-days: 30

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x86_64
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
      APP_NAME: WareHound

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # libpcap ships with the macOS SDK (universal), so no Homebrew package is needed
    - name: Build C++ Sniffer dylib (CMake)
      run: |
        cmake -S WareHound.Sniffer -B build/sniffer-${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
        cmake --build build/sniffer-${{ matrix.arch }} --config ${{ env.BUILD_CONFIGURATION }} --target WareHound.Sniffer
        find build/sniffer-${{ matrix.arch }} -name "libWareHound.Sniffer.dylib"

    - name: Publish Avalonia app
      run: |
        dotnet publish ${{ env.AVALONIA_PROJECT }} \
          -c ${{ env.BUILD_CONFIGURATION }} \
          -r ${{ env.RID }} \
          --self-contained true \
          -p:UseAppHost=true \
          -p:SkipNativeSnifferBuild=true \
          -p:Version=${{ env.VERSION }} \
          -o publish/${{ env.RID }}

    - name: Create .app bundle
      run: |
        APP="dist/${APP_NAME}.app"
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp -R publish/${RID}/. "$APP/Contents/MacOS/"

        # P/Invoke uses "WareHound.Sniffer.dll"; on macOS .NET probes "<name>.dylib",
        # so ship the dylib as WareHound.Sniffer.dll.dylib
        DYLIB=$(find build/sniffer-${{ matrix.arch }} -name "libWareHound.Sniffer.dylib" | head -n 1)
        if [ -z "$DYLIB" ]; then echo "[ERROR] libWareHound.Sniffer.dylib not found"; exit 1; fi
        cp "$DYLIB" "$APP/Contents/MacOS/WareHound.Sniffer.dll.dylib"

        sed -e "s/__VERSION__/${VERSION}/g" installer/macos/Info.plist > "$APP/Contents/Info.plist"
        chmod +x "$APP/Contents/MacOS/WareHound.Avalonia"

        # Ad-hoc signature so the bundle runs on Apple Silicon (not notarized)
        codesign --force --deep --sign - "$APP"
        codesign --verify --verbose "$APP"

    - name: Build DMG
      run: |
        mkdir -p installer-output dmg-root
        cp -R "dist/${APP_NAME}.app" dmg-root/
        ln -s /Applications dmg-root/Applications
        hdiutil create \
          -volname "${APP_NAME}" \
          -srcfolder dmg-root \
          -ov -format UDZO \
          "installer-output/WareHound-Avalonia-${VERSION}-${RID}.dmg"
        ls -la installer-output

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WareHound-Avalonia-macOS-${{ matrix.arch }}
        path: installer-output/*.dmg
        retention-days: 30

  release:
    if: needs.version.outputs.tag != ''
    needs: [ version, windows, macos ]
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: WareHound-Avalonia-*
        path: release-assets
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: WareHound ${{ needs.version.outputs.tag }}
        files: release-assets/*
        token: ${{ secrets.GITHUB_TOKEN }}
